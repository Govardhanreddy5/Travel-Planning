spring.application.name=tripnest-backend
server.port=${PORT:8080}

# Production Supabase PostgreSQL Datasource (IPv4 Connection Pooler for Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}}}
spring.datasource.username=${DB_USER:postgres.fcthobeoyuugxrzruxlc}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (tuned for Supabase pooler / direct connection)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TripNestProdHikariPool

# Hibernate in production: update schema gracefully
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway migrations with baseline enabled for existing tables
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security & JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# External Services
openweather.api.key=${OPENWEATHER_API_KEY:}
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=TripNest/1.0 (travel planning platform)
