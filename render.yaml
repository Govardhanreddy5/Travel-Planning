services:
  - type: web
    name: tripnest-backend
    runtime: docker
    plan: free
    rootDir: tripnest-backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        value: "aws-0-ap-south-1.pooler.supabase.com"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        value: "postgres.fcthobeoyuugxrzruxlc"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: "require"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
