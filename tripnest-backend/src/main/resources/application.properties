spring.application.name=tripnest-backend
server.port=${PORT:8080}

# Datasource Configuration (PostgreSQL / Supabase)
# Supports full JDBC URL (via SPRING_DATASOURCE_URL or DATABASE_URL) or granular environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Optimized for cloud hosted Postgres like Supabase)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TripNestHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Schema migrations. The local H2 profile disables these and lets Hibernate create
# its disposable in-memory schema for development and tests.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# Security & JWT (Keep authentication as existing Spring Security + JWT implementation)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# External Services
openweather.api.key=${OPENWEATHER_API_KEY:}

# Email / SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OpenStreetMap Nominatim
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=TripNest/1.0 (travel planning platform)
